<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Login</title>

<link rel="stylesheet" href="css/global.css">

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.login-box{
background:white;
width:420px;
padding:40px;
border-radius:25px;
box-shadow:0 10px 40px rgba(0,0,0,.08);
}

h1{
text-align:center;
margin-bottom:25px;
}

input{
width:100%;
padding:14px;
border:1px solid #ddd;
border-radius:12px;
margin-bottom:15px;
}

button{
width:100%;
border:none;
cursor:pointer;
}

</style>

</head>

<body>

<div class="login-box">

<h1>CampusLearn</h1>

<input type="email" placeholder="Email">

<input type="password" placeholder="Password">

<a href="dashboard.html" class="btn-primary" style="display:block;text-align:center;">
Masuk
</a>

</div>

</body>
</html>
