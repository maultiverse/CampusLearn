<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemindMe – CampusLearn</title>
<link rel="stylesheet" href="css/global.css">
<style>
.filter-row { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
.f-btn {
  padding: 8px 18px; border-radius: 20px;
  border: 1.5px solid #E5E7EB; background: white;
  font-family: 'Poppins', sans-serif; font-size: .8rem;
  font-weight: 500; cursor: pointer; transition: all .2s;
}
.f-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.vid-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 18px; }
.vid-card {
  background: white; border-radius: 18px; overflow: hidden;
  box-shadow: 0 3px 16px rgba(0,0,0,.06); transition: transform .2s;
}
.vid-card:hover { transform: translateY(-3px); }
.v-thumb {
  height: 130px; display: flex; align-items: center;
  justify-content: center; font-size: 2.8rem; position: relative;
}
.v-thumb img { width: 80px; height: 80px; object-fit: contain; }
.v-dur {
  position: absolute; bottom: 8px; right: 8px;
  background: rgba(0,0,0,.55); color: white;
  font-size: .68rem; font-weight: 600; padding: 3px 8px; border-radius: 6px;
}
.lock {
  position: absolute; inset: 0; background: rgba(0,0,0,.5);
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 4px; color: white; font-size: .8rem; font-weight: 600;
}
.v-body { padding: 16px; }
.v-body h3 { font-size: .87rem; font-weight: 700; margin-bottom: 4px; }
.v-body .meta { font-size: .73rem; color: var(--gray); margin-bottom: 12px; }
.watch { display: inline-block; background: #EEF2FF; color: var(--primary); padding: 7px 16px; border-radius: 10px; font-size: .78rem; font-weight: 600; transition: all .2s; }
.watch:hover { background: var(--primary); color: white; }
.upgrade { display: inline-block; background: #FEF9C3; color: #92400E; padding: 7px 16px; border-radius: 10px; font-size: .78rem; font-weight: 600; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo"><h2>CampusLearn</h2><span>Platform Belajar Mahasiswa</span></div>
  <nav class="menu">
    <a href="dashboard.html">🏠 Home</a>
    <a href="clive.html">🔴 C-Live</a>
    <a href="ringkasin.html">📄 Ringkasin</a>
    <a href="remindme.html" class="active">🎬 RemindMe</a>
    <a href="studygroup.html">👥 Study Group</a>
    <a href="profile.html">👤 Profil</a>
  </nav>
  <div class="sidebar-bottom">
    <div class="user-info">
      <div class="avatar" id="sb-avatar">R</div>
      <div><div class="user-name" id="sb-name">-</div><div class="user-plan" id="sb-plan">-</div></div>
    </div>
    <div class="logout-btn" onclick="logout()">🚪 Keluar</div>
  </div>
</div>

<div class="main">
  <div class="page-header">
    <h1>🎬 RemindMe</h1>
    <p>Rekaman semua sesi live teaching — tonton kapan saja</p>
  </div>

  <input type="text" class="search-bar" id="q" placeholder="🔍︎Cari rekaman, tutor, atau mata kuliah..." oninput="render()">

  <div class="filter-row" id="filters">
    <button class="f-btn active" onclick="setFilter('Semua',this)">Semua</button>
    <button class="f-btn" onclick="setFilter('Kalkulus 1',this)">Kalkulus 1</button>
    <button class="f-btn" onclick="setFilter('Kalkulus 2',this)">Kalkulus 2</button>
    <button class="f-btn" onclick="setFilter('Fisika Dasar',this)">Fisika Dasar</button>
    <button class="f-btn" onclick="setFilter('Kimia Dasar',this)">Kimia Dasar</button>
    <button class="f-btn" onclick="setFilter('Pemrograman Dasar',this)">Progdas</button>
    <button class="f-btn" onclick="setFilter('Biologi',this)">Biologi</button>
    <button class="f-btn" onclick="setFilter('Excel Dasar',this)">Excel</button>
  </div>

  <div class="vid-grid" id="grid"></div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('clUser') || 'null');
if (!user) window.location.href = 'login.html';
else {
  const first = user.name.split(' ')[0];
  document.getElementById('sb-name').textContent = first;
  document.getElementById('sb-avatar').textContent = first[0].toUpperCase();
  document.getElementById('sb-plan').textContent = user.plan === 'premium' ? '⭐ Premium' : '🔵 Basic';
}
function logout() { localStorage.removeItem('clUser'); window.location.href = 'login.html'; }

const videos = [
  { icon:'<img src="assets/kalku.png">', bg:'#EEF2FF', title:'Limit Fungsi', matkul:'Kalkulus 1', tutor:'Andi Mahardika', dur:'1j 20m', date:'2 hari lalu', premium:false },
  { icon:'<img src="assets/kalku.png">', bg:'#EEF2FF', title:'Turunan & Aturan Rantai', matkul:'Kalkulus 1', tutor:'Andi Mahardika', dur:'1j 05m', date:'5 hari lalu', premium:false },
  { icon:'<img src="assets/kalku2.png">', bg:'#EEF2FF', title:'Integral Parsial', matkul:'Kalkulus 2', tutor:'Andi Mahardika', dur:'1j 30m', date:'1 minggu lalu', premium:true },
  { icon:'<img src="assets/kalku2.png">', bg:'#EEF2FF', title:'Deret Taylor', matkul:'Kalkulus Lanjutan', tutor:'Dian Kusuma', dur:'1j 30m', date:'2 minggu lalu', premium:true },
  { icon:'<img src="assets/fisika 1.png">', bg:'#FFF7ED', title:'Gerak Lurus Beraturan', matkul:'Fisika Dasar', tutor:'Budi Santoso', dur:'55m', date:'3 hari lalu', premium:false },
  { icon:'<img src="assets/fisika 1.png">', bg:'#FFF7ED', title:'Hukum Newton', matkul:'Fisika Dasar', tutor:'Budi Santoso', dur:'1j 10m', date:'1 minggu lalu', premium:true },
  { icon:'<img src="assets/kimia1.png">', bg:'#F0FDF4', title:'Stoikiometri Dasar', matkul:'Kimia Dasar', tutor:'Eka Putri', dur:'1j 05m', date:'4 hari lalu', premium:false },
  { icon:'<img src="assets/bio1.png">', bg:'#F0FDF4', title:'Sel & Organel', matkul:'Biologi', tutor:'Fitri Amelia', dur:'60m', date:'6 hari lalu', premium:true },
  { icon:'<img src="assets/data.png">', bg:'#F5F3FF', title:'Pengenalan Python', matkul:'Pemrograman Dasar', tutor:'Citra Dewi', dur:'1j 20m', date:'2 hari lalu', premium:false },
  { icon:'<img src="assets/data.png">', bg:'#F5F3FF', title:'Perulangan & Array', matkul:'Pemrograman Dasar', tutor:'Citra Dewi', dur:'1j 15m', date:'5 hari lalu', premium:true },
  { icon:'<img src="assets/metopen.png">', bg:'#FFF7ED', title:'Desain Penelitian', matkul:'Metodologi Penelitian', tutor:'Dian Kusuma', dur:'70m', date:'1 minggu lalu', premium:true },
  { icon:'<img src="assets/data.png">', bg:'#FFF7ED', title:'VLOOKUP & PivotTable', matkul:'Excel Dasar', tutor:'Andi Mahardika', dur:'50m', date:'3 hari lalu', premium:false },
];

let activeFilter = 'Semua';
function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const isPremium = user.plan === 'premium';
  const filtered = videos.filter(v => {
    const matchF = activeFilter === 'Semua' || v.matkul === activeFilter;
    const matchQ = !q || v.title.toLowerCase().includes(q) || v.matkul.toLowerCase().includes(q) || v.tutor.toLowerCase().includes(q);
    return matchF && matchQ;
  });

  document.getElementById('grid').innerHTML = filtered.map(v => {
    const locked = v.premium && !isPremium;
    return `
      <div class="vid-card">
        <div class="v-thumb" style="background:${v.bg}">
          ${v.icon}
          <div class="v-dur">${v.dur}</div>
          ${locked ? '<div class="lock">🔒<span>Premium</span></div>' : ''}
        </div>
        <div class="v-body">
          <h3>${v.title}</h3>
          <div class="meta">${v.matkul} • ${v.tutor} • ${v.date}</div>
          ${locked
            ? `<a href="index.html#harga" class="upgrade">⭐ Upgrade Premium</a>`
            : `<a href="#" class="watch" onclick="alert('Pemutar video akan dibuka!');return false;">▶ Tonton</a>`
          }
        </div>
      </div>
    `;
  }).join('');
}
render();
</script>
</body>
</html>
