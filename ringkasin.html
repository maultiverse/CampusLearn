<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ringkasin – CampusLearn</title>
<link rel="stylesheet" href="css/global.css">
<style>
.matkul-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; }
.mk-card {
  background: white; border-radius: 20px; padding: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,.06);
  cursor: pointer; transition: transform .2s, box-shadow .2s;
}
.mk-card:hover { transform: translateY(-4px); box-shadow: 0 8px 28px rgba(0,0,0,.1); }
.mk-icon { font-size: 2rem; margin-bottom: 12px; }
.mk-icon img { width: 56px; height: 56px; object-fit: contain; }
.mk-card h3 { font-size: .95rem; font-weight: 700; margin-bottom: 4px; }
.mk-card .tc { font-size: .78rem; color: var(--gray); margin-bottom: 14px; }
.prog-bar { background: #F3F4F6; border-radius: 20px; height: 6px; }
.prog-fill { background: var(--primary); border-radius: 20px; height: 6px; transition: width .4s; }
.prog-lbl { font-size: .7rem; color: var(--gray); margin-top: 5px; }

/* Modal */
.overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.45); z-index: 300;
  align-items: center; justify-content: center;
}
.overlay.open { display: flex; }
.modal {
  background: white; border-radius: 24px;
  width: 90%; max-width: 540px; padding: 36px;
  max-height: 80vh; overflow-y: auto;
}
.modal-head { display: flex; justify-content: space-between; margin-bottom: 22px; }
.modal-head h2 { font-size: 1.15rem; font-weight: 700; }
.modal-close { cursor: pointer; font-size: 1.3rem; color: var(--gray); line-height: 1; }
.topic-list { list-style: none; }
.topic-list li {
  padding: 12px 0; border-bottom: 1px solid #F3F4F6;
  display: flex; justify-content: space-between; align-items: center;
  font-size: .87rem;
}
.topic-list li:last-child { border-bottom: none; }
.t-done { color: #16a34a; font-weight: 600; font-size: .76rem; }
.t-todo { color: var(--gray); font-size: .76rem; }
#m-icon img { width: 48px; height: 48px; object-fit: contain; }
</style>
</head>
<body>

<div class="sidebar">
  <div class="logo"><h2>CampusLearn</h2><span>Platform Belajar Mahasiswa</span></div>
  <nav class="menu">
    <a href="dashboard.html">🏠 Home</a>
    <a href="clive.html">🔴 C-Live</a>
    <a href="ringkasin.html" class="active">📄 Ringkasin</a>
    <a href="remindme.html">🎬 RemindMe</a>
    <a href="studygroup.html">👥 Study Group</a>
    <a href="profile.html">👤 Profil</a>
  </nav>
  <div class="sidebar-bottom">
    <div class="user-info">
      <div class="avatar" id="sb-avatar">R</div>
      <div><div class="user-name" id="sb-name">-</div><div class="user-plan" id="sb-plan">-</div></div>
    </div>
    <div class="logout-btn" onclick="logout()">🚪 Keluar</div>
  </div>
</div>

<div class="main">
  <div class="page-header">
    <h1>📄 Ringkasin</h1>
    <p>Rangkuman materi terstruktur per mata kuliah</p>
  </div>

  <input type="text" class="search-bar" placeholder="🔍 Cari mata kuliah atau topik..." oninput="filter(this.value)">

  <div class="matkul-grid" id="grid"></div>
</div>

<!-- Modal -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-head">
      <div>
        <div id="m-icon" style="margin-bottom:6px;"></div>
        <h2 id="m-title"></h2>
      </div>
      <div class="modal-close" onclick="closeModalDirect()">✕</div>
    </div>
    <ul class="topic-list" id="m-topics"></ul>
  </div>
</div>

<script>
const user = JSON.parse(localStorage.getItem('clUser') || 'null');
if (!user) window.location.href = 'login.html';
else {
  const first = user.name.split(' ')[0];
  document.getElementById('sb-name').textContent = first;
  document.getElementById('sb-avatar').textContent = first[0].toUpperCase();
  document.getElementById('sb-plan').textContent = user.plan === 'premium' ? '⭐ Premium' : '🔵 Basic';
}
function logout() { localStorage.removeItem('clUser'); window.location.href = 'login.html'; }

const data = [
  { icon:'<img src="assets/kalku.png">', name:'Kalkulus 1', prog:80, topics:['Limit Fungsi','Turunan (Diferensial)','Aturan Rantai','Aplikasi Turunan','Fungsi Implisit','Teorema Nilai Rata-Rata','Integral Tak Tentu','Integral Tertentu','Teorema Dasar Kalkulus','Teknik Substitusi','Integral Parsial','Luas Daerah'] },
  { icon:'<img src="assets/kalku2.png">', name:'Kalkulus 2', prog:60, topics:['Integral Lipat Dua','Integral Lipat Tiga','Koordinat Polar','Deret Tak Hingga','Deret Taylor & Maclaurin','Persamaan Diferensial Orde 1','Persamaan Diferensial Orde 2','Transformasi Laplace','Vektor di R3','Fungsi Vektor','Volume Benda Putar'] },
  { icon:'<img src="assets/kalku2.png">', name:'Kalkulus Lanjutan', prog:30, topics:['Analisis Real','Barisan & Deret','Konvergensi','Fungsi Multi-variabel','Gradien & Divergen','Teorema Green','Teorema Stokes','Integral Garis','Integral Permukaan'] },
  { icon:'<img src="assets/fisika1.png">', name:'Fisika Dasar', prog:70, topics:['Kinematika','Dinamika Newton','Usaha & Energi','Momentum & Impuls','Gerak Rotasi','Fluida Statis','Fluida Dinamis','Termofisika','Gelombang','Optika Geometris'] },
  { icon:'<img src="assets/fisika2.png">', name:'Fisika Mekanika', prog:45, topics:['Mekanika Lagrange','Mekanika Hamilton','Gerak Osilasi','Medan Sentral','Mekanika Benda Tegar','Mekanika Fluida Lanjutan','Relativitas Khusus','Mekanika Kuantum Pengantar'] },
  { icon:'<img src="assets/kimia1.png">', name:'Kimia Dasar', prog:55, topics:['Struktur Atom','Tabel Periodik','Ikatan Kimia','Stoikiometri','Larutan','Asam & Basa','Reaksi Redoks','Termokimia','Kinetika Kimia','Kesetimbangan Kimia'] },
  { icon:'<img src="assets/bio1.png">', name:'Biologi', prog:65, topics:['Sel & Organel','Membran Sel','Metabolisme Sel','DNA & RNA','Sintesis Protein','Pembelahan Sel','Genetika Mendel','Evolusi','Ekosistem'] },
  { icon:'<img src="assets/data.png">', name:'Pemrograman Dasar', prog:75, topics:['Algoritma & Flowchart','Variabel & Tipe Data','Operator','Percabangan (if-else)','Perulangan (loop)','Array','Fungsi / Prosedur','String','Rekursi','Pengantar OOP'] },
  { icon:'<img src="assets/metopen.png">', name:'Metodologi Penelitian', prog:50, topics:['Jenis Penelitian','Rumusan Masalah','Tinjauan Pustaka','Hipotesis','Instrumen Penelitian','Analisis Data Kuantitatif','Analisis Data Kualitatif','Penulisan Laporan'] },
  { icon:'<img src="assets/data.png">', name:'Excel Dasar', prog:40, topics:['Antarmuka Excel','Rumus Dasar (SUM, AVERAGE)','Referensi Sel','Fungsi IF','Fungsi VLOOKUP','Grafik & Chart','PivotTable','Format & Print'] },
];

function render(list) {
  document.getElementById('grid').innerHTML = list.map((m,i) => `
    <div class="mk-card" onclick="openModal(${i})">
      <div class="mk-icon">${m.icon}</div>
      <h3>${m.name}</h3>
      <div class="tc">${m.topics.length} Topik</div>
      <div class="prog-bar"><div class="prog-fill" style="width:${m.prog}%"></div></div>
      <div class="prog-lbl">Progress: ${m.prog}%</div>
    </div>
  `).join('');
}
render(data);

function filter(q) {
  const f = data.filter(m =>
    m.name.toLowerCase().includes(q.toLowerCase()) ||
    m.topics.some(t => t.toLowerCase().includes(q.toLowerCase()))
  );
  render(f);
}

let current = [];
function openModal(i) {
  current = data;
  const m = current[i] || data[i];
  document.getElementById('m-icon').innerHTML = m.icon; // ganti textContent → innerHTML
  document.getElementById('m-title').textContent = m.name;
  const doneCount = Math.round(m.topics.length * m.prog / 100);
  document.getElementById('m-topics').innerHTML = m.topics.map((t,ti) => `
    <li>
      <span>${t}</span>
      <span class="${ti < doneCount ? 't-done' : 't-todo'}">${ti < doneCount ? '✓ Selesai' : 'Belum'}</span>
    </li>
  `).join('');
  document.getElementById('overlay').classList.add('open');
}
function closeModal(e) { if (e.target.id === 'overlay') closeModalDirect(); }
function closeModalDirect() { document.getElementById('overlay').classList.remove('open'); }
</script>
</body>
</html>
